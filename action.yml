name: 'FerrFlow Fixtures'
description: 'Generate git fixture repos from declarative JSON definitions'
author: 'FerrLabs'
branding:
  icon: 'box'
  color: 'orange'

inputs:
  definitions:
    description: 'Path to directory containing JSON fixture definitions (provided by the consumer repo)'
    required: true
  generated-dir:
    description: 'Output directory for generated fixture repos'
    required: false
    default: ''

outputs:
  generated-path:
    description: 'Path to generated fixture repos'
    value: ${{ steps.generate.outputs.generated-path }}

runs:
  using: 'composite'
  steps:
    - name: Hash generator sources
      id: hash
      shell: bash
      env:
        GENERATOR_DIR: ${{ github.action_path }}/generator
      run: |
        HASH="$(cd "$GENERATOR_DIR" && find Cargo.toml Cargo.lock src -type f | sort | xargs sha256sum | sha256sum | cut -d' ' -f1)"
        echo "hash=$HASH" >> "$GITHUB_OUTPUT"

    - name: Cache generator build
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ${{ runner.temp }}/fixtures-target
        key: fixtures-generator-${{ runner.os }}-${{ steps.hash.outputs.hash }}

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

    - name: Build generator
      shell: bash
      working-directory: ${{ github.action_path }}/generator
      env:
        CARGO_TARGET_DIR: ${{ runner.temp }}/fixtures-target
      run: cargo build --release

    - name: Prepare output directory
      id: prepare
      shell: bash
      env:
        INPUT_GENERATED_DIR: ${{ inputs.generated-dir }}
      run: |
        GEN_DIR="$INPUT_GENERATED_DIR"
        if [[ -z "$GEN_DIR" ]]; then
          GEN_DIR="$(mktemp -d)/generated"
        fi
        mkdir -p "$GEN_DIR"
        echo "gen-dir=$GEN_DIR" >> "$GITHUB_OUTPUT"

    - name: Validate definitions
      shell: bash
      env:
        DEFINITIONS: ${{ inputs.definitions }}
        GENERATOR: ${{ runner.temp }}/fixtures-target/release/generate-fixtures
      run: |
        "$GENERATOR" \
          --validate \
          --definitions "$DEFINITIONS"

    - name: Generate fixtures
      id: generate
      shell: bash
      env:
        DEFINITIONS: ${{ inputs.definitions }}
        GENERATOR: ${{ runner.temp }}/fixtures-target/release/generate-fixtures
        GEN_DIR: ${{ steps.prepare.outputs.gen-dir }}
      run: |
        "$GENERATOR" \
          --definitions "$DEFINITIONS" \
          --output "$GEN_DIR"
        echo "generated-path=$GEN_DIR" >> "$GITHUB_OUTPUT"
